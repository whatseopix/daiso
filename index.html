<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼트트랙 기록실</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            padding: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛸️ 쇼트트랙 기록 대시보드</h1>
    <div id="loading" class="loading">데이터를 불러오는 중입니다...</div>
    <div id="table-container"></div>
</div>

<script>
    // 구글 앱스 스크립트 웹 앱 URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe5T6FzG5ZnxulbkQT1IQobZATQkjXkwDTn8FcXI8boT2igc533fHL9sskKvkgxXIo/exec';

    async function loadData() {
        const loadingEl = document.getElementById('loading');
        const containerEl = document.getElementById('table-container');

        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            if (!data || data.length === 0) {
                loadingEl.textContent = '표시할 데이터가 없습니다.';
                return;
            }

            // 테이블 생성
            let html = '<table><thead><tr>';
            
            // 헤더 생성 (첫 번째 행 기준)
            const headers = Object.keys(data[0]);
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr></thead><tbody>';

            // 데이터 행 생성
            data.forEach(row => {
                html += '<tr>';
                headers.forEach(header => {
                    html += `<td>${row[header] !== undefined ? row[header] : ''}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';

            loadingEl.style.display = 'none';
            containerEl.innerHTML = html;

        } catch (error) {
            console.error('데이터 로드 실패:', error);
            loadingEl.innerHTML = '<div class="error">데이터를 불러오는 데 실패했습니다. 스크립트 배포 상태를 확인해 주세요.</div>';
        }
    }

    // 페이지 로드 시 데이터 가져오기 실행
    loadData();
</script>

</body>
</html>
