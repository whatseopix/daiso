<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그냥 털었어 다이소 - 럭키 드로우 이벤트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }
        .container { background-color: #1e1e1e; border: 2px solid #ff4d4d; border-radius: 12px; width: 100%; max-width: 600px; padding: 30px; box-shadow: 0 0 20px rgba(255, 77, 77, 0.3); position: relative; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        h1 { text-align: center; color: #ff4d4d; font-size: 24px; flex-grow: 1; }
        
        .version-badge {
            background-color: #2a1a1a;
            border: 1px solid #ff4d4d;
            color: #ff8080;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            white-space: nowrap;
        }

        .subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        .step-box { background-color: #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .step-title { font-size: 15px; color: #ff8080; margin-bottom: 12px; font-weight: bold; }
        
        select { width: 100%; padding: 12px; background-color: #121212; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 16px; outline: none; }
        select:focus { border-color: #ff4d4d; }

        .gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .gift-card { background-color: #333; border: 2px solid #444; border-radius: 8px; padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: center; min-height: 85px; }
        .gift-card:hover:not(.selected) { border-color: #ff4d4d; background-color: #3a2222; transform: translateY(-2px); }
        .gift-card.selected { background-color: #2c2c2c; border-color: #555; opacity: 0.85; cursor: not-allowed; }
        
        .gift-num { font-size: 18px; font-weight: bold; color: #ff8080; }
        .gift-name { font-size: 11px; color: #ccc; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gift-owner { font-size: 12px; color: #ff4d4d; margin-top: 4px; font-weight: bold; }

        .footer-flex { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .update-info { font-size: 11px; color: #777; }
        .reset-btn { background: none; border: 1px solid #555; color: #aaa; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .reset-btn:hover { border-color: #ff4d4d; color: #ff4d4d; }

        .loading { text-align: center; color: #888; padding: 20px; }
        .my-selection-notice { font-size: 13px; color: #4da6ff; margin-top: 8px; font-weight: bold; display: none; }

        /* 화면 전체 로딩 차단 오버레이 스타일 */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff4d4d;
            font-size: 16px;
            font-weight: bold;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #ff4d4d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">구글 시트에서 데이터를 불러오는 중...</div>
</div>

<div class="container">
    <div class="header-flex">
        <div style="width: 70px;"></div>
        <h1>🛒 그냥 털었어 다이소</h1>
        <div class="version-badge" id="versionBadge">v3.0 (2026.09.23)</div>
    </div>
    <div class="subtitle">지원2담당 럭키 드로우 이벤트</div>

    <!-- STEP 1 -->
    <div class="step-box">
        <div class="step-title">👤 STEP 1. 참가자 본인 이름을 선택하세요</div>
        <select id="participantSelect" onchange="onParticipantChange()">
            <option value="">-- 이름을 선택하세요 --</option>
        </select>
        <div id="mySelectionNotice" class="my-selection-notice"></div>
    </div>

    <!-- STEP 2 -->
    <div class="step-box">
        <div class="step-title">🛍️ STEP 2. 마음에 드는 상품 번호를 터치하여 선택하세요</div>
        <div id="giftContainer" class="loading">데이터를 불러오는 중입니다...</div>
    </div>

    <div class="footer-flex">
        <span class="update-info">최종 빌드: 2026-09-23 11:45</span>
        <button class="reset-btn" onclick="resetData()">⚙️ 관리자 초기화</button>
    </div>
</div>

<script>
    const APP_VERSION = "v3.0";
    const API_URL = "https://script.google.com/macros/s/AKfycbyJkFAFXubEACEwBIdi_GYu3Y-vOkcaayERm4mcOoZcQ94VVXXPSr3TLy7k3KbEbvX-/exec";
    let globalData = { participants: [], gifts: [] };

    console.log(`[Daiso Event] Client Script Loaded - Version: ${APP_VERSION}`);

    function showLoading(text = "처리 중입니다...") {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    // 데이터 불러오기
    function loadData(isSilent = false) {
        if (!isSilent) {
            showLoading("구글 시트에서 데이터를 불러오는 중...");
        }

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if(data.error) {
                    if(!isSilent) alert("데이터 로드 오류: " + data.error);
                    return;
                }
                globalData = data;
                initParticipants();
                renderGifts();
                checkMySelection();
            })
            .catch(err => {
                hideLoading();
                console.error(err);
                if(!isSilent) {
                    document.getElementById('giftContainer').innerHTML = '<span style="color:#ff4d4d;">데이터를 불러오지 못했습니다.</span>';
                }
            });
    }

    // 참가자 목록 렌더링 (이미 선택한 사람은 제외)
    function initParticipants() {
        const select = document.getElementById('participantSelect');
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>';
        
        const selectedEmpNames = new Set(globalData.gifts.filter(g => g.selected).map(g => g.empName));

        globalData.participants.forEach(p => {
            if (!selectedEmpNames.has(p.name)) {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name;
                if(p.name === currentVal) opt.selected = true;
                select.appendChild(opt);
            }
        });
    }

    // 상품 목록 렌더링
    function renderGifts() {
        const container = document.getElementById('giftContainer');
        if(container.classList.contains('loading')) {
            container.innerHTML = '';
            container.className = 'gift-grid';
        }

        container.innerHTML = '';
        globalData.gifts.forEach(gift => {
            const card = document.createElement('div');
            card.className = `gift-card ${gift.selected ? 'selected' : ''}`;
            
            let html = `<div class="gift-num">${gift.number}번</div>`;
            
            if(gift.selected) {
                html += `<div class="gift-name" title="${gift.name}">${gift.name}</div>`;
                html += `<div class="gift-owner">${gift.empName}</div>`;
            } else {
                html += `<div class="gift-name">미선택</div>`;
            }
            
            card.innerHTML = html;

            if(!gift.selected) {
                card.onclick = () => selectGift(gift.number);
            }
            container.appendChild(card);
        });
    }

    function onParticipantChange() {
        checkMySelection();
    }

    function checkMySelection() {
        const nameSelect = document.getElementById('participantSelect');
        const selectedName = nameSelect.value;
        const noticeDiv = document.getElementById('mySelectionNotice');

        if (!selectedName) {
            noticeDiv.style.display = 'none';
            noticeDiv.textContent = '';
            return;
        }

        const alreadyPicked = globalData.gifts.find(g => g.selected && g.empName === selectedName);
        if (alreadyPicked) {
            noticeDiv.style.display = 'block';
            noticeDiv.textContent = `ℹ️ [${selectedName}]님은 이미 ${alreadyPicked.number}번(${alreadyPicked.name}) 상품을 선택하셨습니다.`;
        } else {
            noticeDiv.style.display = 'none';
            noticeDiv.textContent = '';
        }
    }

    // 상품 선택 실행
    function selectGift(giftNumber) {
        const nameSelect = document.getElementById('participantSelect');
        const selectedName = nameSelect.value;

        if(!selectedName) {
            alert("먼저 STEP 1에서 본인 이름을 선택해주세요!");
            nameSelect.focus();
            return;
        }

        const alreadyPicked = globalData.gifts.find(g => g.selected && g.empName === selectedName);
        if (alreadyPicked) {
            alert(`[${selectedName}]님은 이미 상품을 선택하셨습니다!\n1인당 1개의 상품만 선택할 수 있습니다.`);
            return;
        }

        const inputPw = prompt(`[${selectedName}]님, 본인의 사번(PW)을 입력해주세요:`);
        if(inputPw === null) return;

        if(!inputPw.trim()) {
            alert("사번을 입력하셔야 합니다.");
            return;
        }

        // 로딩 오버레이 표시
        showLoading("선택하신 번호를 처리중입니다...");

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ name: selectedName, pw: inputPw.trim(), giftNumber: giftNumber })
        })
        .then(res => res.json())
        .then(res => {
            // 응답을 받으면 우선 로딩 화면을 숨김
            hideLoading();

            if(res.status === 'success') {
                alert("성공적으로 선택되었습니다!");
                showLoading("최신 데이터를 동기화하는 중...");
                loadData(false); 
            } else if(res.status === 'invalid_pw') {
                // PW가 틀렸을 경우 안내 멘트 출력 보완
                alert("사번(PW)이 일치하지 않습니다. 올바른 사번을 입력해주세요.");
            } else if(res.status === 'already_selected') {
                alert("아쉽습니다! 그 사이에 다른 사람이 먼저 선택한 상품입니다.");
                loadData(false);
            } else {
                alert("오류가 발생했습니다: " + (res.message || '알 수 없는 오류'));
            }
        })
        .catch(err => {
            hideLoading();
            console.error(err);
            alert("통신 중 오류가 발생했습니다.");
        });
    }

    // 관리자 초기화
    function resetData() {
        const pwd = prompt("관리자 비밀번호를 입력하세요:");
        if(!pwd) return;

        showLoading("초기화 중...");

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'reset', password: pwd })
        })
        .then(res => res.json())
        .then(res => {
            hideLoading();
            if(res.status === 'success') {
                alert("초기화되었습니다.");
                showLoading("최신 데이터를 동기화하는 중...");
                loadData(false);
            } else {
                alert(res.message || "비밀번호가 틀렸거나 초기화에 실패했습니다.");
            }
        })
        .catch(err => {
            hideLoading();
            console.error(err);
            alert("통신 중 오류가 발생했습니다.");
        });
    }

    window.onload = function() {
        loadData(false);
        
        setInterval(() => {
            loadData(true);
        }, 5000);
    };
</script>

</body>
</html>
