<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그냥 털었어 다이소 - 시크릿 럭키박스</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c0e;
            --card-bg: #16161a;
            --gold-primary: #f3c653;
            --gold-secondary: #c99a31;
            --accent-red: #ff334b;
            --text-main: #f0f0f3;
            --text-sub: #94949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            background-image: radial-gradient(circle at 50% 10%, #221c10 0%, #0c0c0e 70%);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        .user-box {
            background: var(--card-bg);
            border: 1px solid rgba(243, 198, 83, 0.2);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .user-box label {
            font-weight: 600;
            color: var(--gold-primary);
        }

        .user-box input {
            background: #0c0c0e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .user-box input:focus {
            border-color: var(--gold-primary);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .box-card {
            background: var(--card-bg);
            border: 2px solid rgba(243, 198, 83, 0.15);
            border-radius: 16px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .box-card:hover:not(.selected) {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: 0 8px 25px rgba(243, 198, 83, 0.25);
        }

        .box-card .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold-primary);
            font-family: 'Outfit', sans-serif;
        }

        .box-card .label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 5px;
        }

        .box-card.selected {
            background: #1e1b15;
            border-color: #443b2a;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .box-card.selected .number {
            color: #555;
            text-decoration: line-through;
        }

        .box-card.selected .label {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 2px solid var(--gold-primary);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 50px rgba(243, 198, 83, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            color: var(--gold-primary);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal .gift-result {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin: 20px 0;
            padding: 15px;
            background: #0c0c0e;
            border-radius: 10px;
            border: 1px dashed var(--gold-secondary);
        }

        .modal button {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            border: none;
            color: #0c0c0e;
            padding: 12px 30px;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .modal button:hover {
            opacity: 0.9;
        }

        .loading {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--gold-primary);
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .admin-panel {
            margin-top: 20px;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-sub);
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .admin-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <div class="loading" id="loadingIndicator">데이터 동기화 중...</div>

    <header>
        <h1>🛍️ 그냥 털었어 다이소</h1>
        <p>14명의 팀원을 위한 시크릿 럭키박스 추첨 이벤트</p>
    </header>

    <div class="user-box">
        <label for="userName">참여자 이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요 (필수)">
    </div>

    <div class="grid-container" id="gridContainer">
        <!-- 1~14번 박스 동적 생성 -->
    </div>

    <div class="admin-panel">
        <button class="admin-btn" onclick="resetEvent()">⚙️ 전체 초기화 (관리자용)</button>
    </div>

    <!-- 결과 모달 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <h2>🎉 당첨 축하합니다!</h2>
            <p id="modalSubText">선택하신 번호의 선물입니다</p>
            <div class="gift-result" id="modalGiftText">다이소 꿀템 세트</div>
            <button onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        // ★★★ 아래에 본인의 구글 앱스 스크립트 웹 앱 URL을 입력하세요 ★★★
        const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        let boxData = [];

        // 페이지 로드 시 데이터 가져오기
        window.onload = function() {
            fetchData();
        };

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }

        async function fetchData() {
            if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                renderDummyBoxes();
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(GAS_URL);
                boxData = await response.json();
                renderBoxes();
            } catch (error) {
                console.error("데이터를 불러오지 못했습니다.", error);
                alert("구글 시트 연동 오류가 발생했습니다. URL을 확인해주세요.");
                renderDummyBoxes();
            } finally {
                showLoading(false);
            }
        }

        // URL 미설정 시 테스트용 더미 렌더링
        function renderDummyBoxes() {
            boxData = [];
            for (let i = 1; i <= 14; i++) {
                boxData.push({ number: i, gift: `다이소 선물 ${i}번`, selected: "", empName: "" });
            }
            renderBoxes();
        }

        function renderBoxes() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            boxData.forEach(item => {
                const card = document.createElement('div');
                const isSelected = item.selected === "Y" || item.selected === true;
                
                card.className = `box-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="number">${item.number}</div>
                    <div class="label">${isSelected ? (item.empName || '선택완료') : 'LUCKY BOX'}</div>
                `;

                if (!isSelected) {
                    card.onclick = () => selectBox(item.number);
                }
                container.appendChild(card);
            });
        }

        async function selectBox(num) {
            const nameInput = document.getElementById('userName');
            const empName = nameInput.value.trim();

            if (!empName) {
                alert("번호를 선택하기 전에 이름을 먼저 입력해주세요!");
                nameInput.focus();
                return;
            }

            if (!confirm(`[${num}번] 럭키박스를 선택하시겠습니까? (선택 후 변경 불가)`)) {
                return;
            }

            if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                // 테스트 모드
                const target = boxData.find(b => b.number === num);
                target.selected = "Y";
                target.empName = empName;
                renderBoxes();
                openModal(target.gift);
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "select", number: num, empName: empName })
                });
                const result = await response.json();

                if (result.status === "success") {
                    openModal(result.gift);
                    fetchData(); // 최신 상태 동기화
                } else {
                    alert(result.message);
                    fetchData(); // 동시성 충돌 시 최신 상태로 새로고침
                }
            } catch (error) {
                console.error("선택 중 오류 발생", error);
                alert("네트워크 오류가 발생했습니다.");
            } finally {
                showLoading(false);
            }
        }

        function openModal(giftName) {
            document.getElementById('modalGiftText').innerText = giftName;
            document.getElementById('resultModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        async function resetEvent() {
            const password = prompt("관리자 비밀번호 또는 초기화 확인 코드를 입력하세요 (초기화: reset)");
            if (password !== "reset") return;

            if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                boxData.forEach(b => { b.selected = ""; b.empName = ""; });
                renderBoxes();
                alert("초기화되었습니다. (테스트 모드)");
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "reset" })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("모든 선택 정보가 초기화되었습니다.");
                    fetchData();
                }
            } catch (error) {
                alert("초기화 실패");
            } finally {
                showLoading(false);
            }
        }
    </script>
</body>
</html>
