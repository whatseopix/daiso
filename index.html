<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지원2담당 이벤트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus {
            border-color: #3498db;
            outline: none;
        }
        .gift-display {
            background: #eef2f3;
            padding: 15px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .admin-btn {
            background-color: #95a5a6;
            margin-top: 30px;
            font-size: 14px;
            padding: 8px;
        }
        .admin-btn:hover {
            background-color: #7f8c8d;
        }
        .loading, .message {
            text-align: center;
            font-size: 16px;
            padding: 20px;
            color: #7f8c8d;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
        .result-card {
            background: #e8f8f5;
            border: 2px solid #27ae60;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
        .result-card h2 {
            color: #27ae60;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .result-gift-name {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 지원2담당 럭키 드로우 이벤트</h1>
    <div id="loading" class="loading">데이터를 불러오는 중입니다...</div>
    
    <div id="app" style="display: none;">
        <div class="form-group">
            <label for="participant-select">참가자 선택</label>
            <select id="participant-select">
                <option value="">-- 이름을 선택하세요 --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gift-select">번호 선택 (선물 미리보기)</label>
            <select id="gift-select" onchange="updateGiftName()">
                <option value="">-- 번호와 선물을 선택하세요 --</option>
            </select>
        </div>

        <div class="form-group">
            <label>선택된 선물 미리보기</label>
            <div id="gift-name-display" class="gift-display">번호를 선택하면 선물이 표시됩니다</div>
        </div>

        <button onclick="submitRecord()">최종 선택 및 응모하기</button>
        <div id="result-message" class="message"></div>
    </div>

    <div id="success-card" style="display: none;" class="result-card">
        <h2>🎉 응모가 완료되었습니다!</h2>
        <p>당첨되신 선물은 다음과 같습니다:</p>
        <div id="final-output-gift" class="result-gift-name"></div>
    </div>

    <!-- 관리자 초기화 버튼 -->
    <button class="admin-btn" onclick="resetData()">⚙️ 관리자 데이터 초기화</button>
</div>

<script>
    // 새 웹 앱 URL 반영
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfl_5N8HNgZ2lRttGwxDgnculZZWdpnF-9SYIK1UZ3io68t_5D3P_0ZnoWUkid_BXl/exec';
    let globalGifts = [];

    async function initData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            const pSelect = document.getElementById('participant-select');
            const gSelect = document.getElementById('gift-select');

            pSelect.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>';
            gSelect.innerHTML = '<option value="">-- 번호와 선물을 선택하세요 --</option>';

            data.participants.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                pSelect.appendChild(opt);
            });

            globalGifts = data.gifts;
            globalGifts.forEach(gift => {
                const opt = document.createElement('option');
                opt.value = gift.number;
                opt.textContent = `번호 ${gift.number}번 - ${gift.name}`;
                gSelect.appendChild(opt);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';

        } catch (error) {
            console.error('초기화 실패:', error);
            document.getElementById('loading').innerHTML = '<span class="error">데이터를 불러오는 데 실패했습니다. 배포 상태를 확인해주세요.</span>';
        }
    }

    function updateGiftName() {
        const selectedNum = document.getElementById('gift-select').value;
        const displayEl = document.getElementById('gift-name-display');

        if (!selectedNum) {
            displayEl.textContent = '번호를 선택하면 선물이 표시됩니다';
            return;
        }

        const found = globalGifts.find(g => String(g.number) === String(selectedNum));
        if (found) {
            displayEl.textContent = `${found.number}번: ${found.name}`;
        } else {
            displayEl.textContent = '선물을 찾을 수 없습니다';
        }
    }

    async function submitRecord() {
        const name = document.getElementById('participant-select').value;
        const giftNumber = document.getElementById('gift-select').value;
        const giftNameDisplay = document.getElementById('gift-name-display').textContent;
        const msgEl = document.getElementById('result-message');

        if (!name) {
            alert('참가자 이름을 선택해주세요.');
            return;
        }
        if (!giftNumber) {
            alert('번호를 선택해주세요.');
            return;
        }

        msgEl.textContent = '기록 중입니다...';
        msgEl.className = 'message';

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: name,
                    giftNumber: giftNumber,
                    giftName: giftNameDisplay
                })
            });

            document.getElementById('app').style.display = 'none';
            document.getElementById('final-output-gift').textContent = giftNameDisplay;
            document.getElementById('success-card').style.display = 'block';

        } catch (error) {
            console.error('기록 실패:', error);
            msgEl.textContent = '기록 중 오류가 발생했습니다.';
            msgEl.className = 'message error';
        }
    }

    async function resetData() {
        const password = prompt('관리자 비밀번호를 입력하세요:');
        if (!password) return;

        if (password !== '1234') {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        if (!confirm('정말로 모든 추첨 기록과 참가 상태를 초기화하시겠습니까?')) {
            return;
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'reset',
                    password: password
                })
            });

            alert('성공적으로 초기화되었습니다.');
            location.reload();
        } catch (error) {
            console.error('초기화 실패:', error);
            alert('초기화 중 오류가 발생했습니다.');
        }
    }

    initData();
</script>

</body>
</html>
