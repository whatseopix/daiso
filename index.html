<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼트트랙 선물 추첨 시스템</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus {
            border-color: #3498db;
            outline: none;
        }
        .gift-display {
            background: #eef2f3;
            padding: 15px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .loading, .message {
            text-align: center;
            font-size: 16px;
            padding: 20px;
            color: #7f8c8d;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 럭키 드로우 추첨 시스템</h1>
    <div id="loading" class="loading">데이터를 불러오는 중입니다...</div>
    
    <div id="app" style="display: none;">
        <div class="form-group">
            <label for="participant-select">참가자 선택</label>
            <select id="participant-select">
                <option value="">-- 이름을 선택하세요 --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gift-select">남은 번호 선택</label>
            <select id="gift-select" onchange="updateGiftName()">
                <option value="">-- 번호를 선택하세요 --</option>
            </select>
        </div>

        <div class="form-group">
            <label>선택된 선물</label>
            <div id="gift-name-display" class="gift-display">번호를 선택하면 선물이 표시됩니다</div>
        </div>

        <button onclick="submitRecord()">추첨 완료 및 저장하기</button>
        <div id="result-message" class="message"></div>
    </div>
</div>

<script>
    // 새로 발급된 구글 앱스 스크립트 웹 앱 URL 반영
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2SG93l5CiI6Lum2mWbmrhEKo-bHx8baRBpx1mgn6HbcPsSJQZK7SeUJJtv0UEMBiV/exec';
    let globalGifts = [];

    async function initData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            const pSelect = document.getElementById('participant-select');
            const gSelect = document.getElementById('gift-select');

            // 참가자 리스트 채우기
            data.participants.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                pSelect.appendChild(opt);
            });

            // 남은 선물 리스트 채우기
            globalGifts = data.gifts;
            globalGifts.forEach(gift => {
                const opt = document.createElement('option');
                opt.value = gift.number;
                opt.textContent = `번호: ${gift.number}`;
                gSelect.appendChild(opt);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';

        } catch (error) {
            console.error('초기화 실패:', error);
            document.getElementById('loading').innerHTML = '<span class="error">데이터를 불러오는 데 실패했습니다. 배포 상태를 확인해주세요.</span>';
        }
    }

    function updateGiftName() {
        const selectedNum = document.getElementById('gift-select').value;
        const displayEl = document.getElementById('gift-name-display');

        if (!selectedNum) {
            displayEl.textContent = '번호를 선택하면 선물이 표시됩니다';
            return;
        }

        const found = globalGifts.find(g => String(g.number) === String(selectedNum));
        if (found) {
            displayEl.textContent = found.name;
        } else {
            displayEl.textContent = '선물을 찾을 수 없습니다';
        }
    }

    async function submitRecord() {
        const name = document.getElementById('participant-select').value;
        const giftNumber = document.getElementById('gift-select').value;
        const giftNameDisplay = document.getElementById('gift-name-display').textContent;
        const msgEl = document.getElementById('result-message');

        if (!name) {
            alert('참가자 이름을 선택해주세요.');
            return;
        }
        if (!giftNumber) {
            alert('번호를 선택해주세요.');
            return;
        }

        msgEl.textContent = '기록 중입니다...';
        msgEl.className = 'message';

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: name,
                    giftNumber: giftNumber,
                    giftName: giftNameDisplay
                })
            });

            msgEl.textContent = '성공적으로 기록되었습니다! 🎉';
            msgEl.className = 'message success';

            // 1.5초 후 페이지 새로고침하여 목록 갱신
            setTimeout(() => {
                location.reload();
            }, 1500);

        } catch (error) {
            console.error('기록 실패:', error);
            msgEl.textContent = '기록 중 오류가 발생했습니다.';
            msgEl.className = 'message error';
        }
    }

    initData();
</script>

</body>
</html>
